name: Deploy scout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-scout.yml"
      - "packages/scout/**"
      - "package.json"
      - "bun.lock"
      - "railpack.scout.drop.json"
      - "railpack.scout.json"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-scout-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun --cwd packages/scout check-types

      - name: Build
        run: |
          mkdir -p packages/scout/dist
          bun build packages/scout/src/index.ts \
            --target=bun \
            --production \
            --external=playwright \
            --external=playwright-core \
            --outfile=packages/scout/dist/index.js

      - name: Install Playwright browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/scout/.playwright
        run: bun --cwd packages/scout x playwright install --only-shell chromium

      - name: Package prebuilt deployment
        run: |
          deployment_directory="${RUNNER_TEMP}/artifacts-scout-drop"
          archive_path="${RUNNER_TEMP}/artifacts-scout-drop.zip"

          mkdir -p "$deployment_directory"
          git archive --format=tar HEAD | tar -xf - -C "$deployment_directory"
          cp -R packages/scout/dist "$deployment_directory/packages/scout/dist"
          cp -R packages/scout/.playwright "$deployment_directory/packages/scout/.playwright"
          cp railpack.scout.drop.json "$deployment_directory/railpack.json"

          cd "$deployment_directory"
          zip -q -r "$archive_path" .
          echo "SCOUT_DROP_ARCHIVE=$archive_path" >> "$GITHUB_ENV"

      - name: Upload prebuilt deployment to Dokploy
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_SCOUT_ID || vars.DOKPLOY_SCOUT_ID }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || vars.DOKPLOY_URL }}
        run: |
          if [[ -z "$DOKPLOY_URL" ]]; then
            echo "::error::DOKPLOY_URL is not configured as a repository secret or variable."
            exit 1
          fi

          if [[ -z "$DOKPLOY_API_TOKEN" ]]; then
            echo "::error::DOKPLOY_API_TOKEN is not configured as a repository secret."
            exit 1
          fi

          if [[ -z "$DOKPLOY_APPLICATION_ID" ]]; then
            echo "::error::DOKPLOY_SCOUT_ID is not configured as a repository secret or variable."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.dropDeployment" \
            --header "accept: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --form "applicationId=${DOKPLOY_APPLICATION_ID}" \
            --form "dropBuildPath=." \
            --form "zip=@${SCOUT_DROP_ARCHIVE};type=application/zip"
