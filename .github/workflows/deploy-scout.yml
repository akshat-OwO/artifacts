name: Deploy scout

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-scout.yml"
      - "packages/scout/**"
      - "package.json"
      - "bun.lock"
      - "railpack.scout.json"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-scout-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun --cwd packages/scout check-types

      - name: Build
        run: bun build packages/scout/src/index.ts --target=bun --packages=external --outdir=/tmp/scout-build

      - name: Deploy to Dokploy
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_SCOUT_ID || vars.DOKPLOY_SCOUT_ID }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || vars.DOKPLOY_URL }}
        run: |
          if [[ -z "$DOKPLOY_URL" ]]; then
            echo "::error::DOKPLOY_URL is not configured as a repository secret or variable."
            exit 1
          fi

          if [[ -z "$DOKPLOY_API_TOKEN" ]]; then
            echo "::error::DOKPLOY_API_TOKEN is not configured as a repository secret."
            exit 1
          fi

          if [[ -z "$DOKPLOY_APPLICATION_ID" ]]; then
            echo "::error::DOKPLOY_SCOUT_ID is not configured as a repository secret or variable."
            exit 1
          fi

          curl --fail-with-body \
            --retry 3 \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"
