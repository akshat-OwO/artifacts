name: Deploy web

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-web.yml"
      - "apps/web/**"
      - "package.json"
      - "bun.lock"
      - "railpack.web.drop.json"
      - "railpack.web.json"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun --cwd apps/web check-types

      - name: Build
        run: bun --cwd apps/web build

      - name: Package prebuilt deployment
        run: |
          deployment_directory="${RUNNER_TEMP}/artifacts-web-drop"
          archive_path="${RUNNER_TEMP}/artifacts-web-drop.zip"

          mkdir -p "$deployment_directory"
          git archive --format=tar HEAD | tar -xf - -C "$deployment_directory"
          cp -R apps/web/.output "$deployment_directory/apps/web/.output"
          cp railpack.web.drop.json "$deployment_directory/railpack.json"

          cd "$deployment_directory"
          zip -q -r "$archive_path" .
          echo "WEB_DROP_ARCHIVE=$archive_path" >> "$GITHUB_ENV"

      - name: Upload prebuilt deployment to Dokploy
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_WEB_ID || vars.DOKPLOY_WEB_ID }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL || vars.DOKPLOY_URL }}
        run: |
          if [[ -z "$DOKPLOY_URL" ]]; then
            echo "::error::DOKPLOY_URL is not configured as a repository secret or variable."
            exit 1
          fi

          if [[ -z "$DOKPLOY_API_TOKEN" ]]; then
            echo "::error::DOKPLOY_API_TOKEN is not configured as a repository secret."
            exit 1
          fi

          if [[ -z "$DOKPLOY_APPLICATION_ID" ]]; then
            echo "::error::DOKPLOY_WEB_ID is not configured as a repository secret or variable."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.dropDeployment" \
            --header "accept: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --form "applicationId=${DOKPLOY_APPLICATION_ID}" \
            --form "dropBuildPath=." \
            --form "zip=@${WEB_DROP_ARCHIVE};type=application/zip"
