name: Deploy web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "package.json"
      - "bun.lock"
      - "railpack.web.json"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun --cwd apps/web check-types

      - name: Build
        run: bun --cwd apps/web build

      - name: Deploy to Dokploy
        env:
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_WEB_ID }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
        run: |
          curl --fail-with-body \
            --retry 3 \
            --request POST \
            "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
            --data "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"
