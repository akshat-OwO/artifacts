name: Stage CLI release

on:
  push:
    branches:
      - main
    paths:
      - "packages/cli/package.json"
  workflow_dispatch:

concurrency:
  group: stage-cli-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Check whether the version is already published
        id: version
        working-directory: packages/cli
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage package on npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/cli
        run: npm stage publish --access public
